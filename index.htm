<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Phim Hoạt Hình</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 20px;
      text-align: center;
    }
    h1 { font-size: 1.8rem; margin-bottom: 8px; color: #38bdf8; }
    
    /* Khung video chuẩn */
    .player-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .player-wrapper video {
      width: 100%;
      max-height: 550px;
      display: block;
    }

    /* Danh sách tập */
    .episode-section {
      margin-top: 25px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
    }
    .episode-title {
      font-size: 1.1rem;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .episode-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .ep-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .ep-btn:hover, .ep-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Rạp Phim Hoạt Hình</h1>
      <p id="current-title">Đang phát: Tom & Jerry - The Movie</p>
    </header>

    <!-- Khung phát HTML5 Video -->
    <div class="player-wrapper">
      <video id="video-player" controls preload="metadata">
        <source id="video-source" src="" type="video/mp4">
        Trình duyệt không hỗ trợ thẻ video.
      </video>
    </div>

    <!-- Danh sách tập -->
    <div class="episode-section">
      <div class="episode-title">Chọn tập phim:</div>
      <div class="episode-list" id="button-container"></div>
    </div>
  </div>

  <script>
    const episodes = [
  { 
    title: "Tom & Jerry", 
    url: "https://archive.org/embed/youtube-4AlelC_OVFc" 
  }
  // Bạn có thể thêm các tập tiếp theo ở đây...
];

    const player = document.getElementById("video-player");
    const source = document.getElementById("video-source");
    const currentTitle = document.getElementById("current-title");
    const container = document.getElementById("button-container");

    function playVideo(index) {
      const ep = episodes[index];
      source.src = ep.url;
      player.load();
      player.play().catch(e => console.log("Chờ người dùng bấm play"));
      currentTitle.innerText = `Đang phát: ${ep.title}`;

      document.querySelectorAll(".ep-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });
    }

    episodes.forEach((ep, index) => {
      const btn = document.createElement("button");
      btn.className = "ep-btn";
      btn.innerText = ep.title;
      btn.onclick = () => playVideo(index);
      container.appendChild(btn);
    });

    if (episodes.length > 0) {
      playVideo(0);
    }
  </script>
</body>
</html>
